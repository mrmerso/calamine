[package]
name = "calamine"
version = "0.36.1"
authors = ["Johann Tuffe <tafia973@gmail.com>"]
repository = "https://github.com/tafia/calamine"
documentation = "https://docs.rs/calamine"
description = "An Excel/OpenDocument Spreadsheet reader and deserializer in pure Rust"
license = "MIT"
readme = "README.md"
keywords = ["excel", "ods", "xls", "xlsx", "xlsb"]
categories = ["encoding", "parsing", "text-processing"]
exclude = ["tests/**/*"]
edition = "2021"
rust-version = "1.88" # For zip

[dependencies]
log = "0.4"
serde = "1.0"
codepage = "0.1"
atoi_simd = "0.18"
byteorder = "1.5"
encoding_rs = "0.8"
fast-float2 = "0.2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.41", features = ["encoding"] }

# Optional dependencies.
chrono = { version = "0.4", features = ["serde"], optional = true, default-features = false }
rust_decimal = { version = "1.43.0", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
glob = "0.3"
sha2 = "0.10"
env_logger = "0.11"
serde_derive = "1.0"
rstest = { version = "0.26", default-features = false }
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "basic"
harness = false

# Example that requires the `rust_decimal` feature.
[[example]]
name = "decimal"
required-features = ["rust_decimal"]

# Example that requires the `picture` feature.
[[example]]
name = "read_picture_data"
required-features = ["picture"]

[features]
default = []

# `chrono`: Adds support for Chrono dates and times.
chrono = ["dep:chrono"]

# `rust_decimal`: Adds support for reading numbers as `rust_decimal::Decimal`.
rust_decimal = ["dep:rust_decimal"]

# `picture`: Adds support for reading raw data for pictures in spreadsheets.
picture = []

# `dates`: Backwards compatible synonym for the `chrono` feature.
dates = ["chrono"]

[package.metadata.docs.rs]
features = ["chrono", "picture", "rust_decimal"]
rustdoc-args = ["--cfg", "docsrs"]
